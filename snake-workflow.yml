# ═══════════════════════════════════════════════════════════════════════
# 🐍 CONTRIBUTION SNAKE — GitHub Actions Workflow
# ═══════════════════════════════════════════════════════════════════════
# Place this file at: .github/workflows/snake.yml in your r-json/r-json repo
# This generates the animated snake that eats your contribution graph.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"  # Runs every 12 hours
  workflow_dispatch:          # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: r-json
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
